    <link rel="stylesheet" href="../css/medicalCheck.css">


<body>
    <h5 class="title">Pregledi</h5>

    <div class="container">
        <div class="d-flex justify-content-center px-5">
            <div class="search">
                <button type="button" class="btn btn-primary" onclick="getChecks()">Ucitaj preglede</button>
                <hr>
                <select class="form-select d-none" aria-label="Default select example" id="patients" onchange="showDocMenu()">
                    <option selected>Open this select menu</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <h3 class="title">Osnovne informacije</h3>
                <table class="table table-hover table-white d-none" id="checksTable">
                    <thead>
                        <tr>
                            <th scope="col">id</th>
                            <th scope="col">Naziv pregleda</th>
                            <th scope="col">opis</th>
                            <th scope="col">pacijent</th>

                        </tr>
                    </thead>
                    <tbody class="lab">
                        <tr>
                            <td>id</td>
                            <td>Ultrazvuk abdomena</td>
                            <td>Opis</td>
                            <td>patient_id</td>

                        </tr>

                    </tbody>
                </table>
            </div>
            <div class="col-md-3 d-grid">
                <h3 class="title">Opcije Pacijenata</h3>
                <div class="d-grid gap-4">
                    <button type="button" class="btn btn-success" onclick="goToAddCheck()">Dodaj pregled</button>

                </div>

            </div>
        </div>
    </div>
