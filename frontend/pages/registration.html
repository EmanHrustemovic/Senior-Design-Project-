
    <link rel="stylesheet" href="../css/registration.css">

  <div class="container">
    <div class="col-12">
      <form onsubmit="registerUser(event)">
        <div class="form-row" >
          <div class="form-group col-md-6">
            <label for="inputEmail4">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Email">
          </div>
          <div class="form-group col-md-6">
            <label for="inputPassword4">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password">
          </div>
        </div>
        <div class="form-group">
          <label for="inputAddress">Ime</label>
          <input type="text" class="form-control" id="name" placeholder="Jack">
        </div>
        <div class="form-group">
          <label for="inputAddress2">Prezime</label>
          <input type="text" class="form-control" id="lastName" placeholder="Walker">
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Registruj se</button>
        </div>
        <div class="feedback"></div>
        <div class="nameFeedback"></div>
        <div class="lastNameFeedback"></div>
        <div class="phoneFeedback"></div>
        <div class="emailFeedback"></div>
        <div class="passwordFeedback"></div>
      </form>
    </div>
  </div>
